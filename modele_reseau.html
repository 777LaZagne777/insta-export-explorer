<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon réseau Instagram</title>
<style>
:root {
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --neutral:#898781;
}
.timebar { display:flex; gap:10px; align-items:center; padding:8px 12px; border-top:1px solid var(--grid); font-size:12.5px; }
.timebar input { flex:1; min-width:80px; }
.timebar button { font:inherit; height:28px; padding:0 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap; }
.timebar .m { color:var(--muted); white-space:nowrap; }
.timebar .tout { min-width:120px; font-weight:600; white-space:nowrap; }
.split { display:flex; gap:2px; height:10px; width:120px; margin-top:4px; }
.split span { height:100%; min-width:1px; }
.split span:first-child { border-radius:4px 0 0 4px; }
.split span:last-child { border-radius:0 4px 4px 0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px; }
.chips span { font-size:12.5px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); }
details.more { margin:6px 0; }
details.more summary { cursor:pointer; }
details.more p { color:var(--ink2); margin:6px 0 0; max-width:110ch; }
.listwrap { overflow:auto; }
.list th, .list td { padding:7px 10px; border-bottom:1px solid var(--grid); text-align:left; vertical-align:top; }
.list th { font-weight:600; color:var(--ink2); font-size:12.5px; white-space:nowrap; }
.list td.who { white-space:nowrap; }
.list td.who button { font:inherit; font-weight:600; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
.list td.who button:hover { text-decoration:underline; }
.list .m { color:var(--ink2); }
.list a { color:inherit; white-space:nowrap; }
.list a.btn { display:inline-block; padding:3px 10px; border:1px solid var(--axis); border-radius:8px; text-decoration:none; font-size:12.5px; background:var(--surface); }
.list a.btn:hover { background:var(--wash); }
.list tr.fait { opacity:.45; }
.list tr.fait td.who button { text-decoration:line-through; }
.section { margin-bottom:12px; }
ul.bilan { margin:6px 0 10px; padding-left:20px; max-width:90ch; }
ul.bilan li { margin:5px 0; }
.concl { margin:10px 0 0; max-width:90ch; font-weight:600; }
pre { background:var(--wash); padding:10px 12px; border-radius:6px; overflow:auto; font-size:12.5px; }
.stories svg { display:block; width:100%; height:auto; }
.stories .bar { fill:var(--s1); }
.stories .hit { fill:transparent; }
.stories .hit:hover { fill:var(--wash); }
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:1240px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; margin:0 0 2px; }
h2 { font-size:15px; margin:0 0 4px; }
h3 { font-size:13.5px; margin:14px 0 2px; }
.sub { color:var(--ink2); margin:0 0 16px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
.kpi .v { font-size:26px; font-weight:650; line-height:1.1; }
.kpi .l { color:var(--ink2); font-size:12.5px; }
.notice { border-left:3px solid var(--ink2); background:var(--wash); padding:10px 12px; border-radius:6px; margin-bottom:14px; color:var(--ink2); }
.tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; border-bottom:1px solid var(--grid); }
.tabs button { font:inherit; background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px; color:var(--ink2); cursor:pointer; }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }
.panel[hidden] { display:none; }
.filters { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-bottom:12px; }
.chip { font:inherit; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; }
.chip[aria-pressed="false"] { opacity:.45; text-decoration:line-through; }
.chip .n { color:var(--muted); }
.sw { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
.sw.hollow { background:var(--surface); border:1.5px solid var(--neutral); }
.sw.sq { border-radius:2px; }
input[type=search] { font:inherit; padding:5px 10px; border-radius:8px; border:1px solid var(--axis); background:var(--surface); color:var(--ink); min-width:190px; }
label.rng { display:inline-flex; align-items:center; gap:6px; color:var(--ink2); font-size:12.5px; }
.graphwrap { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
@media (max-width:900px) { .graphwrap { grid-template-columns:1fr; } }
.stage { position:relative; padding:0; overflow:hidden; }
#graph { display:block; width:100%; height:auto; aspect-ratio:1080/960; touch-action:none; cursor:grab; }
#graph.drag { cursor:grabbing; }
.zoom { position:absolute; right:10px; top:10px; display:flex; gap:4px; }
.zoom button { font:inherit; width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; }
.zoom button.w { width:auto; padding:0 10px; }
.count { position:absolute; left:12px; top:12px; color:var(--muted); font-size:12px; }
.node { cursor:pointer; }
.node .dot { stroke:var(--surface); stroke-width:1.5; }
.node.close .dot { stroke:var(--ink); stroke-width:2; }
.node.hollow .dot { fill:var(--surface); stroke:var(--neutral); }
.node.sel .halo { stroke:var(--ink); stroke-width:2; fill:none; }
.node.dim { opacity:.12; }
.lbl { font-size:11px; fill:var(--ink); paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; pointer-events:none; }
.guide { fill:none; stroke:var(--grid); stroke-width:1; }
.guidetxt { font-size:10px; fill:var(--muted); paint-order:stroke; stroke:var(--surface); stroke-width:3px; }
.edge { stroke:var(--muted); fill:none; }
.glink { stroke:var(--ink2); stroke-width:1.2; stroke-dasharray:4 4; fill:none; opacity:.7; }
#tip { position:fixed; z-index:10; pointer-events:none; background:var(--surface); color:var(--ink); border:1px solid var(--border); box-shadow:0 4px 14px rgba(0,0,0,.14); border-radius:8px; padding:8px 10px; font-size:12.5px; max-width:300px; display:none; }
#tip b { display:block; }
#tip .m { color:var(--ink2); }
.detail h2 { font-size:17px; word-break:break-word; }
.detail a { color:inherit; }
.detail .nm { color:var(--ink2); margin:0 0 8px; }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 10px; }
.badge { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); display:inline-flex; gap:6px; align-items:center; }
.detail p { margin:6px 0; }
table { border-collapse:collapse; width:100%; }
.detail table td { padding:3px 0; border-bottom:1px solid var(--grid); }
.detail table td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
.detail .cap { color:var(--muted); font-size:12px; margin-top:12px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--ink2); font-size:12.5px; margin:0 0 12px; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.bars { display:grid; grid-template-columns:minmax(110px,190px) minmax(0,1fr) 52px; gap:5px 10px; align-items:center; }
.bars .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; }
.bars .who button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
.bars .who button:hover { text-decoration:underline; }
.bars .track { display:flex; gap:2px; height:16px; }
.bars .seg { height:100%; min-width:1px; }
.bars .seg:last-child { border-radius:0 4px 4px 0; }
.bars .val { font-variant-numeric:tabular-nums; color:var(--ink2); }
.chrono svg { display:block; width:100%; height:auto; }
.chrono .bar { fill:var(--s1); }
.chrono .hit { fill:transparent; }
.chrono .hit:hover { fill:var(--wash); }
.axis-t { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
.tablewrap { overflow:auto; max-height:70vh; }
#table th, #table td { padding:6px 10px; border-bottom:1px solid var(--grid); text-align:left; white-space:nowrap; }
#table th { position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none; font-weight:600; }
#table td.num, #table th.num { text-align:right; font-variant-numeric:tabular-nums; }
#table tbody tr { cursor:pointer; }
#table tbody tr:hover { background:var(--wash); }
details.how { margin-top:14px; color:var(--ink2); }
details.how summary { cursor:pointer; color:var(--ink); font-weight:600; }
details.how ul { margin:8px 0 0; padding-left:20px; }
.empty { padding:40px 16px; text-align:center; color:var(--ink2); }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip"></div>
<script>
const D = /*__DONNEES__*/null;
</script>
<script>
(function () {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = (q, r = document) => r.querySelector(q);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat(3).forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs || {})) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  kids.flat(3).forEach(c => { if (c != null) e.append(c); });
  return e;
}
const app = $('#app');
if (!D) {
  app.append(h('div', { class: 'card empty' }, 'Aucune donnée. Lance d’abord : python analyse_instagram.py "chemin du dossier d’export"'));
  return;
}

/* ---------- Données ---------- */
const P = D.personnes;
const byId = new Map(P.map(p => [p.id, p]));
const W = D.poids;
const ORDER = ['mutuel', 'suivi', 'abonne', 'inconnu', 'aucun'];
const SEUIL_AUCUN = 5;
const LIENS = {
  mutuel:  { label: 'Vous vous suivez',                   color: 'var(--s1)' },
  suivi:   { label: 'Tu suis ce compte',                  color: 'var(--s2)' },
  abonne:  { label: 'Ce compte te suit',                  color: 'var(--s3)' },
  inconnu: { label: 'Conversation, pseudo non retrouvé',  color: 'var(--neutral)' },
  aucun:   { label: 'Aucun abonnement (score ≥ ' + SEUIL_AUCUN + ')', color: 'var(--neutral)', hollow: true },
};
const nf = n => (Math.round(n * 10) / 10).toLocaleString('fr-FR');
const nom = p => p.pseudo ? '@' + p.pseudo : (p.nom || 'Compte inconnu');
const fdate = ts => new Date(ts * 1000).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const sdate = ts => ts ? new Date(ts * 1000).toLocaleDateString('fr-FR') : '';
const mkey = ts => { const d = new Date(ts * 1000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const mlabel = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); };
function moisEntre(a, b) {
  const out = []; let [y, m] = a.split('-').map(Number); const [y2, m2] = b.split('-').map(Number);
  while (y < y2 || (y === y2 && m <= m2)) { out.push(y + '-' + String(m).padStart(2, '0')); if (++m > 12) { m = 1; y++; } }
  return out;
}
function duree(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / (30.44 * 86400));
  if (m < 1) return 'moins d’un mois';
  const a = Math.floor(m / 12), r = m % 12;
  return [a ? a + (a > 1 ? ' ans' : ' an') : '', r ? r + ' mois' : ''].filter(Boolean).join(' et ');
}
const autres = p => p.reactions * W.reactions + p.commentaires * W.commentaires + p.stories_vues * W.stories_vues;
const SERIES = [
  { k: 'Messages que tu as envoyés', c: 'var(--s1)', pts: p => p.msg_envoyes * W.msg_envoyes },
  { k: 'Messages que tu as reçus',   c: 'var(--s2)', pts: p => p.msg_recus * W.msg_recus },
  { k: 'Tes likes de posts',         c: 'var(--s3)', pts: p => p.likes_posts * W.likes_posts },
  { k: 'Tes likes de stories',       c: 'var(--s4)', pts: p => p.likes_stories * W.likes_stories },
  { k: 'Autres (réactions, commentaires, stories vues)', c: 'var(--s5)', pts: autres },
  { k: 'Vues de tes stories par ce compte', c: 'var(--s6)', pts: p => p.a_vu_stories * W.a_vu_stories + p.revisionnages * W.revisionnages },
];
const STORIES = D.stories || [];
const moisActifs = [...new Set(P.flatMap(p => Object.keys(p.mois)))].sort();
const MOIS = moisActifs.length ? moisEntre(moisActifs[0], moisActifs[moisActifs.length - 1]) : [];
const maxScore = Math.max(1, ...P.map(p => p.score));

const state = { on: Object.fromEntries(ORDER.map(k => [k, true])), min: 0, q: '', sel: null, tab: 'reseau', sort: { k: 'Score', d: -1 } };
const match = p => !state.q || (p.pseudo || '').includes(state.q) || (p.nom || '').toLowerCase().includes(state.q);
const visible = () => P.filter(p => state.on[p.lien] && p.score >= (p.lien === 'aucun' ? Math.max(SEUIL_AUCUN, state.min) : state.min));

/* ---------- Infobulle ---------- */
const tip = $('#tip');
function showTip(ev, ...content) {
  tip.replaceChildren(...content.flat(3).filter(c => c != null));
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

/* ---------- En-tête ---------- */
const nbSuivis = P.filter(p => p.suivi_depuis).length, nbAbonnes = P.filter(p => p.abonne_depuis).length;
const nbMutuels = P.filter(p => p.lien === 'mutuel').length;
const nbMsg = P.reduce((a, p) => a + p.msg_envoyes + p.msg_recus, 0);
const nbConv = P.filter(p => p.msg_envoyes + p.msg_recus > 0).length;
const kpi = (v, l) => h('div', { class: 'card kpi' }, h('div', { class: 'v' }, typeof v === 'number' ? nf(v) : v), h('div', { class: 'l' }, l));
app.append(
  h('h1', null, 'Réseau Instagram de @' + D.moi.pseudo),
  h('p', { class: 'sub' }, 'Généré le ' + D.genere_le + ' à partir de ton export. Tout reste sur ton ordinateur.'),
  h('div', { class: 'kpis' },
    kpi(nbSuivis, 'comptes que tu suis'), kpi(nbAbonnes, 'abonnés présents dans l’export'),
    kpi(nbMutuels, 'abonnements réciproques'), kpi(nbMsg, 'messages privés échangés'), kpi(nbConv, 'personnes avec qui tu discutes'))
);
const premiersSuivis = Math.min(...P.filter(p => p.suivi_depuis).map(p => p.suivi_depuis));
if (MOIS.length && isFinite(premiersSuivis) && mkey(premiersSuivis) < MOIS[0]) {
  app.append(h('div', { class: 'notice' },
    'Cet export ne contient l’activité (messages, likes, stories, nouveaux abonnés) que de ' + mlabel(MOIS[0]) + ' à ' + mlabel(MOIS[MOIS.length - 1]) +
    ', alors que tes abonnements remontent à ' + mlabel(mkey(premiersSuivis)) + '. Les abonnés plus anciens n’y figurent pas, donc certains comptes marqués « Tu suis ce compte » te suivent peut-être aussi. ' +
    'Pour tout avoir, redemande un export avec la période « Depuis le début ».'));
}

/* ---------- Onglets ---------- */
const TABS = [['reseau', 'Réseau'], ['idees', 'Suggestions'], ['abonnes', 'Abonnés'], ['conv', 'Conversations'], ['top', 'Top 20'], ['stories', 'Stories'], ['chrono', 'Chronologie'], ['table', 'Tableau'], ['sait', 'Tes données'], ['pro', 'Insights pro']];
const tabsEl = h('div', { class: 'tabs', role: 'tablist' });
const panels = {};
TABS.forEach(([id, label]) => {
  tabsEl.append(h('button', { role: 'tab', 'data-tab': id, onclick: () => setTab(id) }, label));
  panels[id] = h('section', { class: 'panel', id: 'p-' + id });
});
function setTab(id) {
  state.tab = id;
  tabsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
  for (const k in panels) panels[k].hidden = k !== id;
  filters.style.display = id === 'reseau' || id === 'table' ? '' : 'none';
  hideTip();
}

/* ---------- Filtres (communs au réseau et au tableau) ---------- */
const filters = h('div', { class: 'filters' });
ORDER.forEach(k => {
  const n = P.filter(p => p.lien === k && (k !== 'aucun' || p.score >= SEUIL_AUCUN)).length;
  if (!n) return;
  filters.append(h('button', { class: 'chip', 'aria-pressed': 'true', onclick: e => {
    state.on[k] = !state.on[k]; e.currentTarget.setAttribute('aria-pressed', state.on[k]); refresh();
  } }, h('span', { class: 'sw' + (LIENS[k].hollow ? ' hollow' : ''), style: LIENS[k].hollow ? '' : 'background:' + LIENS[k].color }), LIENS[k].label, h('span', { class: 'n' }, n)));
});
const minOut = h('span', null, '0');
filters.append(
  h('label', { class: 'rng' }, 'Score minimum',
    h('input', { type: 'range', min: 0, max: 50, step: 1, value: 0, oninput: e => { state.min = +e.target.value; minOut.textContent = e.target.value; refresh(); } }), minOut),
  h('input', { type: 'search', placeholder: 'Chercher un pseudo ou un nom', 'aria-label': 'Chercher un compte', oninput: e => { state.q = e.target.value.trim().toLowerCase().replace(/^@/, ''); refresh(); } })
);
app.append(tabsEl, filters, ...Object.values(panels));
setTab('reseau');

/* ---------- Réseau ---------- */
const VB = { w: 1080, h: 960 };
const view = { cx: 0, cy: 0, k: 1 };
const svg = s('svg', { id: 'graph', role: 'img', 'aria-label': 'Graphique du réseau : toi au centre, chaque compte placé selon son score de proximité' });
const countEl = h('div', { class: 'count' });
const detail = h('aside', { class: 'card detail' });
const applyView = () => svg.setAttribute('viewBox', [view.cx - VB.w / 2 / view.k, view.cy - VB.h / 2 / view.k, VB.w / view.k, VB.h / view.k].join(' '));
const zoomBy = f => { view.k = Math.min(8, Math.max(1, view.k * f)); if (view.k === 1) { view.cx = view.cy = 0; } applyView(); };
// Curseur temporel : un cran par mois, le dernier cran = aujourd'hui
const datesLiens = P.flatMap(p => [p.suivi_depuis, p.abonne_depuis]).filter(Boolean);
const bornes = [...datesLiens.map(mkey), ...MOIS].sort();
const T_MOIS = bornes.length ? moisEntre(bornes[0], bornes[bornes.length - 1]) : [];
const tOut = h('span', { class: 'tout' }, 'Aujourd’hui');
const tRange = h('input', { type: 'range', min: 0, max: T_MOIS.length, value: T_MOIS.length, 'aria-label': 'Date affichée sur le graphique' });
let lecture = null;
function setT(v) {
  state.t = v >= T_MOIS.length ? null : v;
  tRange.value = v;
  tOut.textContent = state.t == null ? 'Aujourd’hui' : 'Fin ' + mlabel(T_MOIS[v]);
  drawGraph();
}
function stopLecture() { clearInterval(lecture); lecture = null; tPlay.textContent = '▶ Lecture'; }
const tPlay = h('button', { class: 'w', onclick: () => {
  if (lecture) return stopLecture();
  if (+tRange.value >= T_MOIS.length) setT(0);
  tPlay.textContent = '⏸ Pause';
  lecture = setInterval(() => { const v = +tRange.value + 1; setT(v); if (v >= T_MOIS.length) stopLecture(); }, 450);
} }, '▶ Lecture');
tRange.addEventListener('input', e => { if (lecture) stopLecture(); setT(+e.target.value); });
panels.reseau.append(h('div', { class: 'graphwrap' },
  h('div', { class: 'card stage' }, svg, countEl,
    h('div', { class: 'zoom' },
      h('button', { 'aria-label': 'Zoomer', onclick: () => zoomBy(1.5) }, '+'),

const FIN = D.fin || Date.now() / 1000, JOUR = 86400;

function ideesEcrire() {

    if (!p.pseudo && SUPPRIME.test(p.nom || '')) return;
    if (p.lien === 'aucun' && !dm(p)) return;
    const frais = p.dernier_msg && FIN - p.dernier_msg <= 30 * JOUR;
    let r = null;
    if (p.attend_reponse && frais) r = [1, 'Dernier message de sa part, sans réponse de toi', 'Réponds, même brièvement : la conversation est encore chaude.'];
    else if (p.abonne_depuis && FIN - p.abonne_depuis <= 30 * JOUR && !dm(p)) r = [2, 'Nouvel abonné, aucun message', 'Un mot de bienvenue ou une réaction à sa story suffit.'];
    else if (!dm(p) && (p.revisionnages > 0 || (N >= 2 && p.a_vu_stories >= Math.max(2, 0.6 * N)))) r = [3, 'Regarde tes stories de près, aucun message', 'Pose-lui une question en story ou écris-lui directement.'];
    else if (p.likes_stories >= 3 && !dm(p)) r = [4, 'Tu likes souvent ses stories, aucun message', 'Réponds à sa prochaine story au lieu de seulement la liker.'];
    else if (p.attend_reponse) r = [5, 'Son dernier message est resté sans réponse', 'Relance en reprenant le dernier sujet.'];
    else if (dm(p) >= 10 && FIN - p.dernier_msg > 60 * JOUR) r = [6, 'Conversation active, puis silencieuse', 'Envoie un reel ou une story qui te fait penser à vous deux.'];
    else if (p.lien === 'mutuel' && !dm(p)) r = [7, 'Vous vous suivez, aucun message', 'Réagis à une de ses stories pour ouvrir la discussion.'];
    if (r) out.push({ p, pr: r[0], why: r[1], idee: r[2], quand: p.dernier_msg || (r[0] === 2 ? p.abonne_depuis : null) });
  });
  const recent = x => x.pr === 1 || x.pr === 2 || x.pr === 5;

}

  const estContact = tx('avec_dm') != null ? 'Environ ' + tx('avec_dm') + ' % (' + fb.avec_dm[0] + ' sur ' + fb.avec_dm[1] + ' comptes avec qui tu échangeais des messages)' : 'Probable : vous êtes déjà en contact';
  const estContenu = tx('sans_dm') != null ? 'Environ ' + tx('sans_dm') + ' % (' + fb.sans_dm[0] + ' sur ' + fb.sans_dm[1] + ' comptes sans message), moins pour un gros compte'
    : base == null ? 'Non mesurable' : 'Environ ' + base + ' %, ta moyenne (moins pour un gros compte)';

    else if (dm(p) > 0) out.push({ p, pr: 3, why: 'Vous avez échangé ' + nf(dm(p)) + (dm(p) > 1 ? ' messages' : ' message'), est: estContact });

  const rows = visible().filter(match).sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null || y == null) return (x == null) - (y == null);
    return (x < y ? -1 : x > y ? 1 : 0) * d || b.score - a.score;
  });
  const head = COLS.map(c => h('th', { class: c[3], 'aria-sort': c[0] === k ? (d > 0 ? 'ascending' : 'descending') : null,
    onclick: () => { state.sort = { k: c[0], d: c[0] === k ? -d : (c[3] ? -1 : 1) }; drawTable(); } }, c[0] + (c[0] === k ? (d > 0 ? ' ▲' : ' ▼') : '')));
  const body = rows.map(p => {
    const cells = COLS.map(c => h('td', { class: c[3] }, c[1](p)));
    return h('tr', { onclick: () => { setTab('reseau'); select(p.id); } }, cells);
  });
  const table = h('table', { id: 'table' }, h('thead', null, h('tr', null, head)), h('tbody', null, body));
  panels.table.replaceChildren(h('div', { class: 'card' },
    h('p', { class: 'sub' }, rows.length + ' comptes. Clique sur un en-tête pour trier, sur une ligne pour voir le détail.'),
    h('div', { class: 'tablewrap' }, table)));
}

function refresh() { drawGraph(); drawTable(); }
setTab('reseau'); drawDetail(); drawGraph(); drawIdees(); drawAbonnes(); drawConv(); drawTop(); drawStories(); drawChrono(); drawTable(); drawSait(); drawInsights();
})();
</script>
